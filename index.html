<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolTomato — Smart Tools for Everyday Life</title>

<meta name="description" content="ToolTomato offers free calculators, government employee tools, student tools, business tools, image tools and everyday utilities.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#ef3f3f;
    --red2:#ff5b3d;
    --orange:#ff8a3d;
    --dark:#171b2b;
    --text:#25283a;
    --muted:#777b8c;
    --bg:#fffaf2;
    --white:#ffffff;
    --line:#eee5d7;
    --blue:#35a9df;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font-family:inherit;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,250,242,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--line);
}

.nav{
    max-width:1180px;
    height:74px;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.tomato{
    width:43px;
    height:43px;
    border-radius:12px;
    background:linear-gradient(145deg,#ff5a3c,#e52f35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 6px 15px rgba(239,63,63,.22);
}

.brand-name{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
    color:var(--dark);
}

.brand-name span{
    color:var(--red);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:27px;
    font-size:14px;
    font-weight:700;
}

.nav-links a:hover{
    color:var(--red);
}

.nav-cta{
    background:var(--dark);
    color:white!important;
    padding:11px 18px;
    border-radius:10px;
}

.menu{
    display:none;
    font-size:29px;
    cursor:pointer;
}

/* HERO */

.hero{
    max-width:1180px;
    margin:auto;
    padding:65px 20px 35px;
    text-align:center;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff0e5;
    color:#df5632;
    border:1px solid #ffd6bf;
    padding:8px 15px;
    border-radius:50px;
    font-size:13px;
    font-weight:800;
    margin-bottom:20px;
}

.hero h1{
    max-width:850px;
    margin:auto;
    font-size:clamp(42px,7vw,70px);
    line-height:1.02;
    letter-spacing:-3px;
    color:var(--dark);
}

.hero h1 span{
    background:linear-gradient(90deg,var(--red),var(--orange));
    -webkit-background-clip:text;
    color:transparent;
}

.hero-text{
    max-width:650px;
    margin:19px auto 28px;
    color:var(--muted);
    font-size:17px;
}

.search-box{
    max-width:700px;
    margin:auto;
    position:relative;
}

.search-box input{
    width:100%;
    height:62px;
    border:1px solid #e1d8ca;
    background:white;
    border-radius:16px;
    padding:0 55px 0 22px;
    font-size:16px;
    outline:none;
    box-shadow:0 12px 35px rgba(45,35,20,.07);
}

.search-box input:focus{
    border-color:var(--red);
}

.search-icon{
    position:absolute;
    right:21px;
    top:17px;
    font-size:25px;
    color:#777;
}

/* QUICK ACCESS */

.section{
    max-width:1180px;
    margin:auto;
    padding:28px 20px;
}

.section-title{
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin-bottom:18px;
}

.section-title h2{
    font-size:27px;
    letter-spacing:-1px;
    color:var(--dark);
}

.section-title p{
    color:var(--muted);
    font-size:13px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.quick-card{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:19px;
    display:flex;
    align-items:center;
    gap:15px;
    transition:.2s;
}

.quick-card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(40,30,15,.08);
}

.quick-icon{
    width:50px;
    height:50px;
    border-radius:13px;
    background:#fff1df;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    flex-shrink:0;
}

.quick-card h3{
    font-size:15px;
    margin-bottom:3px;
}

.quick-card p{
    font-size:12px;
    color:var(--muted);
}

/* CATEGORIES */

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.category{
    background:white;
